name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'release' && 'homebrew' || 'build' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      published: ${{ steps.published.outputs.published }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version from Cargo.toml
        id: resolve
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::No version found in Cargo.toml"
            exit 1
          fi
          # Cargo.toml is the source of truth. A tag push must agree with it;
          # a manual run has no tag and simply releases what Cargo.toml says.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version as v$version"

      # A published release for this version is already the finished product,
      # so rebuilding it would burn 90 minutes and could replace artifacts
      # people have downloaded. A leftover draft is this workflow's own
      # output, so it does not count and gets overwritten as before.
      - name: Look for an existing published release
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq .isDraft 2>/dev/null) || draft=missing
          if [ "$draft" = false ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already published; skipping this run"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: macOS
    needs: version
    if: needs.version.outputs.published != 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Install Metal toolchain
        run: |
          if ! xcrun --toolchain Metal metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --toolchain Metal metal --version

      - uses: oven-sh/setup-bun@v2

      - name: Install create-dmg
        run: brew install create-dmg

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.98.1-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.98.1-release-

      - name: Import self-signed code signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          : "${APPLE_CERTIFICATE:?Set APPLE_CERTIFICATE to a Base64-encoded .p12 with its private key}"
          umask 077
          certificate_path="$RUNNER_TEMP/certificate.p12"
          keychain_path="$RUNNER_TEMP/build.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 7200 "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          # Without -v: a self-signed identity need not be a trusted root.
          identity=$(security find-identity -p codesigning "$keychain_path" \
            | awk '/\) [0-9A-Fa-f]+ "/ { print $2; exit }')
          if [[ ! "$identity" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "::error::The .p12 must contain a code signing certificate and its private key"
            exit 1
          fi
          echo "MICHELLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          rm -f "$certificate_path"

      - name: Build, sign, and package DMG
        run: bun run release --local --self-signed

      - name: Remove signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [ -f "$RUNNER_TEMP/build.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain-db"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/Michelle-${{ needs.version.outputs.version }}.dmg
            dist/Michelle-${{ needs.version.outputs.version }}.md
            dist/Michelle-${{ needs.version.outputs.version }}.zip
          if-no-files-found: error

  draft-release:
    name: Draft GitHub release
    needs: [version, macos]
    if: needs.version.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Write release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bun -e '
            import { extractReleaseNotes } from "./scripts/changelog.ts";
            const version = process.env.VERSION;
            const file = Bun.file("CHANGELOG.md");
            const notes = (await file.exists())
              ? extractReleaseNotes(await file.text(), version)
              : null;
            await Bun.write(
              "release-notes.md",
              `${notes ?? "See CHANGELOG.md for details."}\n`,
            );
          '

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          # A manual run has no tag yet; publishing the draft creates this one
          # at the commit that was built.
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.tag }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/*.dmg
            artifacts/*.md
            artifacts/*.zip

  homebrew:
    name: Publish Homebrew cask
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Download release DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" \
            --pattern "Michelle-${TAG#v}.dmg" \
            --dir assets \
            --repo "$GITHUB_REPOSITORY"

      - name: Check out Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: mishamyrt/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Generate cask from published DMG
        run: |
          version="${TAG#v}"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Michelle-${version}.dmg"
          curl --fail --location --silent --show-error "$url" --output "$RUNNER_TEMP/michelle-public.dmg"
          checksum=$(sha256sum "assets/Michelle-${version}.dmg" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/michelle-public.dmg" | sha256sum --check
          mkdir -p homebrew-tap/Casks
          bun scripts/homebrew-cask.ts "$TAG" "$checksum" "$url" > homebrew-tap/Casks/michelle.rb

      - name: Publish cask update
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/michelle.rb
          if git diff --cached --quiet; then
            echo "Cask already matches $TAG"
            exit 0
          fi
          git -c commit.gpgsign=false commit -m "michelle ${TAG#v}"
          git push
