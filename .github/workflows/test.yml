name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust (macOS)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-latest-rust-1.98.1-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            macos-latest-rust-1.98.1-cargo-

      - name: Run tests
        run: cargo test --locked

      - name: Verify in-process Cua SDK and REPL lifecycle
        run: |
          cargo build --locked --package waku --bin waku_js_repl --package waku-computer-use --bin waku_computer_use
          bun scripts/cua-driver.ts bundle target/debug target/debug/resources debug
          bun scripts/test-computer-use.ts
