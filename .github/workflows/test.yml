name: Lint and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust (macOS)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.1

      - name: Install Metal toolchain
        run: |
          if ! xcrun --toolchain Metal metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --toolchain Metal metal --version

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.98.1-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.98.1-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets

      - name: Test release scripts
        run: bun test scripts

      - name: Check translations
        run: bun scripts/check-locales.ts

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Verify in-process Cua SDK and REPL lifecycle
        run: |
          cargo build --locked --package michelle --bin michelle_js_repl --package michelle-computer-use --bin michelle_computer_use
          bun scripts/cua-driver.ts bundle target/debug target/debug/resources debug
          bun scripts/test-computer-use.ts
